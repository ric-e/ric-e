name: Metrics

on:
  schedule:
    - cron: "0 6 * * 1"   # weekly, Mondays 06:00 UTC
  workflow_dispatch:      # manual "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@v3.34   # pinned; don't use @latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}   # CLASSIC PAT, no scopes (public data only)
          user: ric-e
          template: classic
          filename: github-metrics.svg

          # Output goes to a separate branch so main stays clean
          committer_branch: metrics
          committer_message: "chore: update metrics"

          # Card contents: header + activity counts only
          base: header, activity
          base_indepth: yes                          # more accurate PR/commit/issue totals

          # Commit identities used to attribute code to you (all use GitHub noreply emails)
          commits_authoring: ric-e, eric
          config_timezone: America/Toronto

          # Most used languages
          plugin_languages: yes
          plugin_languages_limit: 8
          # Indepth: clone repos and count only lines from YOUR commits
          plugin_languages_indepth: yes
          # Also analyze repos you don't own (archived team project)
          plugin_languages_indepth_custom: jackkoskie/chill-pill
          # Uncomment if notebooks/generated code skew the bar:
          # plugin_languages_ignored: jupyter notebook

          # Make the "N Languages" heading match the bar's legend.
          # (By default it counts GitHub's labels on repos you own, which ignores chill-pill.)
          extras_js: |
            const n = document.querySelectorAll(".field.language").length;
            for (const h2 of document.querySelectorAll("h2.field")) {
              const t = [...h2.childNodes].find(x => x.nodeType === 3 && /Language/.test(x.textContent));
              if (t && n) t.textContent = ` ${n} Language${n === 1 ? "" : "s"} `;
            }
