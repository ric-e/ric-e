name: Song of the day
on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC ≈ 5am Toronto
  workflow_dispatch:       # manual run button for testing
permissions:
  contents: write
jobs:
  song:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: song-of-the-day.svg
          token: NOT_NEEDED
          base: ""
          plugin_music: yes
          plugin_music_playlist: https://embed.music.apple.com/ca/playlist/current-rotation/pl.u-LdbqEgdF2vBZ9yj
          committer_branch: metrics
